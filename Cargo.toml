# Its own workspace, not a member of the stack's (whose Cargo.toml excludes it): a Postgres
# extension is built with pgrx against a Postgres's headers, in its own container
# (container/Containerfile), and pgrx pins its own dependency tree exactly. Its own lockfile, the
# same toolchain.
[workspace]

[package]
name = "snout_utils"
description = "snout_utils: lets a database's owner manage extensions, publications and the settings a platform delegates, without being a superuser."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/snoutdata/snout-utils"
rust-version = "1.98.1"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg17"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

# Pinned exactly, with cargo-pgrx in container/Containerfile: the two must match.
[dependencies]
pgrx = "=0.19.2"
# sigsetjmp from Rust, for the one place an ERROR is caught and re-raised unchanged (src/raw.rs).
# The version pgrx itself uses.
cee-scape = "=0.2.0"

[dev-dependencies]
pgrx-tests = "=0.19.2"

[lints.rust]
# `unsafe` is denied everywhere except the Postgres boundary. This crate IS that boundary (a
# ProcessUtility hook is C's calling convention and Postgres's structs), so it is allowed here and
# confined: the pure logic (names.rs, script.rs) forbids it in its own module.
unsafe_code = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pgrx_embed)'] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# pgrx turns a Postgres ERROR into a Rust panic and back again, so a panic must unwind.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
# Not stripped here: scripts/build-dist.sh strips the shipped copy and keeps the symbols apart.
